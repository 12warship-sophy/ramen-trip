<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>상세정보 · 세계 유명도시 여행 가이드북</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#9c7a45" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="여행가이드북" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="no-nav">
  <header class="topbar">
    <button class="icon-btn" onclick="history.back()" aria-label="뒤로">←</button>
    <h1 class="topbar-title" id="page-title">상세정보</h1>
    <button class="icon-btn" id="share-btn" aria-label="공유">🔗</button>
  </header>

  <main class="screen" id="content"></main>

  <script src="./js/storage.js"></script>
  <script src="./js/data.js"></script>
  <script src="./js/export.js"></script>
  <script src="./js/ramen-data.js"></script>
  <script src="./js/app.js"></script>
  <script>
    const tripId = qs('trip');
    const type = qs('type');
    const id = qs('id');
    const trip = getTrip(tripId);
    const content = document.getElementById('content');

    if (!trip || !type || !id) {
      content.innerHTML = '<p class="empty-state">정보를 찾을 수 없어요.</p>';
    } else {
      document.getElementById('share-btn').addEventListener('click', async () => {
        await copyShareLink();
        toast('링크가 복사되었어요');
      });

      findPlace(type, id).then((place) => {
        if (!place) {
          content.innerHTML = '<p class="empty-state">해당 장소 정보를 찾을 수 없어요.</p>';
          return;
        }

        document.getElementById('page-title').textContent = TYPE_LABEL[type];

        function renderRamenDetail() {
          const fav = isFavorite(trip, 'ramen', id);
          const nickname = place.showNickname && place.recommenderNickname ? `${place.recommenderNickname}님 추천` : '익명 오타쿠 추천';
          const stale = isStaleVisit(place.lastVisited);

          content.innerHTML = `
            <div class="detail-hero">${TYPE_ICON.ramen}</div>
            <h2 class="detail-title">${place.nameKo}</h2>
            <div class="detail-meta">
              <span>${place.nameJa || ''}</span>
            </div>
            <div class="detail-meta">
              <span class="badge">${place.genre || ''}</span>
              <span>${place.priceRange || ''}</span>
              ${place.waiting ? `<span>웨이팅 ${place.waiting}</span>` : ''}
              ${place.seatType ? `<span>${place.seatType}</span>` : ''}
            </div>
            <div class="detail-meta">
              <span class="badge badge-rec">${nickname}</span>
              ${stale ? '<span class="badge badge-warn">정보 확인 필요 (최근 1년 내 방문 정보 아님)</span>' : ''}
            </div>

            <div class="section-title">맛 정보</div>
            <p class="detail-desc" style="margin-bottom:8px;">짠맛 ${barIndicator(place.saltiness)}</p>
            <p class="detail-desc">진한맛 ${barIndicator(place.richness)}</p>

            ${place.recommendedMenu ? `<div class="section-title">추천 메뉴</div><p class="detail-desc">${place.recommendedMenu}</p>` : ''}
            ${place.comment ? `<div class="section-title">한 줄 평</div><p class="detail-desc">${place.comment}</p>` : ''}
            ${place.otakuTip ? `<div class="section-title">오타쿠 팁</div><p class="detail-desc">${place.otakuTip}</p>` : ''}

            <div class="section-title">이용 정보</div>
            <p class="detail-desc">
              ${place.orderPayment ? `주문/결제: ${place.orderPayment}<br />` : ''}
              ${place.hours ? `영업시간: ${place.hours}<br />` : ''}
              ${place.lastVisited ? `마지막 방문: ${place.lastVisited}` : ''}
            </p>

            <div style="display:flex;flex-direction:column;gap:10px;margin-top:8px;">
              ${place.mapUrl ? `<a class="btn-secondary" href="${place.mapUrl}" target="_blank" rel="noopener">🗺️ 구글맵으로 열기</a>` : ''}
              <button id="copy-name-btn" class="btn-outline">🇯🇵 일본어 가게명 복사</button>
              <button id="fav-toggle" class="btn-primary">
                ${fav ? '♥ 찜 목록에서 제거' : '♡ 찜 목록에 추가'}
              </button>
            </div>
          `;

          document.getElementById('copy-name-btn').addEventListener('click', async () => {
            try {
              await navigator.clipboard.writeText(place.nameJa || '');
              toast('일본어 가게명을 복사했어요');
            } catch {
              toast('복사에 실패했어요');
            }
          });
          document.getElementById('fav-toggle').addEventListener('click', () => {
            toggleFavorite(trip, 'ramen', id);
            toast(isFavorite(trip, 'ramen', id) ? '찜 목록에 추가했어요' : '찜 목록에서 제거했어요');
            renderRamenDetail();
          });
        }

        if (type === 'ramen') {
          renderRamenDetail();
          return;
        }

        function badgeText() {
          if (type === 'lodging') return `${place.priceTier} · ${place.pricePerNight.toLocaleString()}원/박`;
          if (type === 'restaurant') return `${place.genre} · ${place.capacity}`;
          return place.category;
        }

        function renderReviews() {
          if (!place.reviews || !place.reviews.length) return '<p class="empty-state">아직 등록된 후기가 없어요.</p>';
          return place.reviews
            .map(
              (r) => `
            <div class="review-card">
              <div class="review-header">
                <span>${r.author} · ${r.date}</span>
                ${r.verified ? '<span class="verified-badge">✅ 실방문 인증</span>' : ''}
              </div>
              <div class="review-content">${r.content}</div>
            </div>`
            )
            .join('');
        }

        function render() {
          const fav = isFavorite(trip, type, id);
          content.innerHTML = `
            <div class="detail-hero">${TYPE_ICON[type]}</div>
            <h2 class="detail-title">${place.name}</h2>
            <div class="detail-meta">
              <span class="badge">${badgeText()}</span>
              &nbsp;★ ${place.rating} (후기 ${place.reviewCount})
            </div>
            <p class="detail-desc">${place.description}</p>

            <div class="section-title">실제 방문자 리뷰 (광고 아님)</div>
            ${renderReviews()}

            <button id="fav-toggle" class="btn-primary" style="margin-top:16px;">
              ${fav ? '♥ 찜 목록에서 제거' : '♡ 찜 목록에 추가'}
            </button>
          `;
          document.getElementById('fav-toggle').addEventListener('click', () => {
            toggleFavorite(trip, type, id);
            toast(isFavorite(trip, type, id) ? '찜 목록에 추가했어요' : '찜 목록에서 제거했어요');
            render();
          });
        }

        render();
      });
    }
  </script>
</body>
</html>
